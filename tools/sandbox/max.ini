# Merged over ffx-rust's sandbox GameSetting.ini (VQ_LOW, TQ_LOW) for our
# test games: every graphics option at its maximum, so HD and PS2 textures
# show at full resolution (TQ_LOW drops the top 2 mip levels of every
# texture). Keys 11-18 only apply with Quality=VQ_CUSTOM (ffx-rust
# docs/formats/platform.md, "Settings").
Quality=VQ_CUSTOM
Anisotropic=16
Shadow=3
TextureQuality=TQ_HIGH
MSAA=8
PostAA=PAA_SMAA4
UnSharpMask=On
HDAO=High
