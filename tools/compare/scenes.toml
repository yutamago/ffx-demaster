# Comparison scenes for tools/compare/compare.py (docs/compare.md).
#
# One [[screen]] per PC replay (tools/replays/<replay>.txt, run through
# tools/calllist). `state` is the PCSX2 save state it starts from
# (C:\_workspaces\pcsx2\sstates\compare\<state>.p2s, made by
# tools/compare/states.txt); `ps2` is the pcsx2ctl script from there, with
# `shot $OUT\<name>.png` for each PS2 frame. `pairs` maps a PS2 shot to the
# PC shot of the replay (`$OUT\<pc>.bmp`) it is compared with.
#
# PS2 pad: cross confirms (PAL), triangle opens the menu. The PC replays
# press circle to confirm (the PC's bindings).
#
# `regions`: name = [x, y, w, h] in the PS2 frame (512x416), for the
# per-region numbers of the 2D screens.

[[screen]]
replay = "ui-mainmenu"
state = "field-cdsp0000"
ps2 = """
press triangle 4 60
shot $OUT\\main.png
"""
pairs = { main = "main-3-ps2-43" }
[screen.regions]
help = [0, 0, 512, 32]
party = [0, 36, 336, 120]
options = [336, 36, 176, 216]
footer = [0, 352, 336, 64]

