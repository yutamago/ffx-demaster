# SPDX-License-Identifier: MIT
# CI: builds the FFX Demaster zip, the bundle of ffx-mods' PS2 mods, from ffx-mods at the
# revision pinned in bundle.toml (as tools/bundle.sh does on Linux), and checks it.
#   bundle   (Windows) ffx-mods' C# mods, demaster.exe (MSVC, static CRT) and
#            demaster_live.dll (32-bit), ffx-mods' tools/package.cs --bundle with
#            tools/package/README.txt, then a check of the zip's contents (every mod,
#            one demaster.exe, no game data)
# ffx-mods' own CI tests the converter and the mods at every revision; this workflow
# builds what the bundle ships. release.yml calls it with the tag.
#
# ffx-mods and ffx-rust (its converter's dependency) are public: no secret is needed.
name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag (v1.2.3); sets the version of the bundle, the mods and the converter
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The release tag (v1.2.3), empty outside a release: then the versions in ffx-mods'
  # Cargo.toml and csproj files stay and the zip is ffx-demaster-ci.zip.
  TAG: ${{ inputs.tag }}

jobs:
  bundle:
    name: Bundle (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7

    - name: Read the pin
      id: pin
      run: |
        python -I - >> "$GITHUB_OUTPUT" <<'EOF'
        import tomllib
        b = tomllib.load(open("bundle.toml", "rb"))["ffx-mods"]
        print("rev=" + b["rev"])
        print("mods=" + ",".join(b["mods"]))
        print("repo=" + b["repo"].removeprefix("https://github.com/").removesuffix(".git"))
        EOF
        cat "$GITHUB_OUTPUT"

    - uses: actions/checkout@v7
      with:
        repository: ${{ steps.pin.outputs.repo }}
        ref: ${{ steps.pin.outputs.rev }}
        path: ffx-mods

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: ffx-mods

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    # --target applies ffx-mods' .cargo/config.toml (+crt-static): no Visual C++ runtime
    # needed. A release sets DEMASTER_VERSION, which each mod compares with its own version.
    - name: Build
      working-directory: ffx-mods
      run: |
        version="${TAG#v}"
        if [ -n "$version" ]; then export DEMASTER_VERSION="$version"; fi
        cargo build --locked --release --target x86_64-pc-windows-msvc -p demaster
        cargo build --locked --release --target i686-pc-windows-msvc -p demaster-live --lib
        target/x86_64-pc-windows-msvc/release/demaster.exe --version
        dotnet build -c Release ${version:+-p:Version="$version"} ffx-mods.slnx

    - name: Package
      working-directory: ffx-mods
      run: |
        version="${TAG#v}"
        dotnet run tools/package.cs -- ../dist "${version:-ci}" --bundle ffx-demaster \
          --mods "${{ steps.pin.outputs.mods }}" --readme ../tools/package/README.txt

    # The shared library with demaster.exe, the installer, README and licences; every mod
    # of bundle.toml with its DLL, settings, README, licences and install script, no
    # demaster.exe of its own; demaster_live.dll for the music engine; nothing else.
    - name: Check the zip
      shell: pwsh
      env:
        MODS: ${{ steps.pin.outputs.mods }}
      run: |
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $zips = @(Get-ChildItem dist -Filter 'ffx-demaster-*.zip')
        if ($zips.Count -ne 1) { throw "expected one zip, found $($zips.Count)" }
        $z = [IO.Compression.ZipFile]::OpenRead($zips[0].FullName)
        $names = $z.Entries.FullName
        $z.Dispose()
        "$($zips[0].Name):"; $names | ForEach-Object { "  $_" }
        $common = 'mods/yuta.ffx-mods'
        $need = @('yuta.ffx-mods.dll', 'yuta.ffx-mods.manifest.json', 'demaster.exe', 'install.cmd', 'install.ps1', 'README.txt', 'LICENSES.txt') | ForEach-Object { "$common/$_" }
        $ids = $env:MODS.Split(',') | ForEach-Object { "yuta.$_" }
        foreach ($id in $ids) {
          foreach ($f in "$id.dll", "$id.manifest.json", 'settings.toml', 'README.txt', 'LICENSES.txt', 'install.cmd', 'install.ps1') { $need += "mods/$id/$f" }
        }
        $need += 'mods/yuta.ps2-music-engine/demaster_live.dll'
        foreach ($f in $need) { if ($names -notcontains $f) { throw "the zip has no $f" } }
        $exes = @($names | Where-Object { $_ -like '*/demaster.exe' })
        if ($exes.Count -ne 1) { throw "expected one demaster.exe, found: $exes" }
        $allowed = @($common) + $ids | ForEach-Object { "mods/$_/*" }
        $bad = $names | Where-Object { $n = $_; -not ($allowed | Where-Object { $n -like $_ }) -or $n -match '/(efl|build|tools|preview|music)/|\.(phyre|iso|bin|img|png|dds|webm|fsb|wav|vbf|bgm|wd|irx)$' }
        if ($bad) { throw "the zip contains files it must not: $bad" }

    - uses: actions/upload-artifact@v7
      with:
        name: bundle
        path: dist/*.zip
        if-no-files-found: error
