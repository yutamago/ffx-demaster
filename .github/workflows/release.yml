# SPDX-License-Identifier: MIT
# Pushing a tag such as v0.2.0 builds the bundle as CI does (build.yml), with that
# version in the converter and the mods, and publishes a GitHub release with
# ffx-demaster-<version>.zip (unpacks straight into the Fahrenheit folder). A tag with
# a "-" (v0.2.0-alpha) makes a prerelease.
name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        merge-multiple: true
        path: dist

    - name: Release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      run: |
        ls -l dist
        cat > notes.md <<EOF
        FFX Demaster: the PS2 mods of [ffx-mods](https://github.com/yutamago/ffx-mods) in one
        zip. Unpack \`ffx-demaster-${TAG#v}.zip\` into your Fahrenheit folder and double-click
        \`mods\\yuta.ffx-mods\\install.cmd\`: it adds every mod to \`mods\\loadorder\` and builds
        their PS2 files from your own Final Fantasy X PS2 disc (an image, or the disc in a drive)
        in one pass. No game data is included. The zip's README.txt has the details; the mods
        are those of bundle.toml at this tag, built from ffx-mods at its pinned revision.
        EOF
        args=(release create "$TAG" "dist/ffx-demaster-${TAG#v}.zip"
              --repo "$REPO" --verify-tag --title "FFX Demaster $TAG"
              --notes-file notes.md --generate-notes)
        if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
        gh "${args[@]}"
