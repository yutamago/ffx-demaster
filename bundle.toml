# FFX Demaster is a bundle: the PS2 mods of ffx-mods in one zip with one install step.
# tools/bundle.sh and CI (.github/workflows/build.yml) build it from ffx-mods at this
# revision. To move to a newer ffx-mods: set rev to its commit, build, test in the game.

[ffx-mods]
repo = "https://github.com/yutamago/ffx-mods.git"
rev = "PIN"

# The mods in the bundle (folders of ffx-mods' mods/), in the converter's order; the
# installer writes them into mods\loadorder in that order. Not in it: the mods of
# ffx-mods that are not PS2 parts (modern-minimap, fps-unlock).
mods = [
    "ps2-music-engine",
    "ps2-soundtrack",
    "ps2-movies",
    "ps2-characters",
    "ps2-maps",
    "ps2-effects",
    "ps2-lighting",
    "no-hd-post-effects",
    "ps2-interface",
    "ps2-aspect-ratio",
    "ps2-game-feel",
    "bug-fixes",
]
